name: Increment the platform version

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: platform-version-main
  cancel-in-progress: false

jobs:
  bump-platform-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Increment the patch version
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
        run: python3 .github/scripts/bump_platform_version.py

      - name: Commit the new version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform-version.json
          if git diff --cached --quiet; then
            echo "Platform version did not change."
            exit 0
          fi
          VERSION="$(python3 -c 'import json; print(json.load(open("platform-version.json", encoding="utf-8"))["version"])')"
          git commit -m "chore: bump platform version to ${VERSION} [skip ci]"
          git push origin HEAD:main
